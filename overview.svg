<svg width="360" height="210" xmlns="http://www.w3.org/2000/svg">
<style>
  svg {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji';
    font-size: 14px;
    line-height: 21px;
  }

  #bg {
    fill: #ffffff;
    stroke: #e1e4e8;
    stroke-width: 1px;
  }

  @media (prefers-color-scheme: dark) {
    #bg {
      fill: #0d1117;
      stroke: #30363d;
    }
  }

  foreignObject {
    width: calc(100% - 20px);
    height: calc(100% - 20px);
  }

  .card {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    padding: 16px 20px;
  }

  .header {
    font-size: 16px;
    font-weight: 600;
    color: #0969da;
    margin: 0 0 12px 0;
    padding-bottom: 8px;
    border-bottom: 1px solid #d0d7de;
  }

  @media (prefers-color-scheme: dark) {
    .header {
      color: #58a6ff;
      border-bottom-color: #21262d;
    }
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 24px;
  }

  .stat-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #57606a;
    opacity: 0;
    animation: fadeIn 0.4s ease-out forwards;
  }

  @media (prefers-color-scheme: dark) {
    .stat-item {
      color: #8b949e;
    }
  }

  .stat-item:nth-child(1) { animation-delay: 0ms; }
  .stat-item:nth-child(2) { animation-delay: 60ms; }
  .stat-item:nth-child(3) { animation-delay: 120ms; }
  .stat-item:nth-child(4) { animation-delay: 180ms; }
  .stat-item:nth-child(5) { animation-delay: 240ms; }
  .stat-item:nth-child(6) { animation-delay: 300ms; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .stat-icon {
    flex-shrink: 0;
    fill: #57606a;
  }

  @media (prefers-color-scheme: dark) {
    .stat-icon {
      fill: #8b949e;
    }
  }

  .stat-value {
    font-weight: 600;
    color: #1f2328;
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }

  @media (prefers-color-scheme: dark) {
    .stat-value {
      color: #e6edf3;
    }
  }
</style>

<rect id="bg" x="0.5" y="0.5" width="359" height="209" rx="6" ry="6"/>

<foreignObject x="10" y="10" width="340" height="190">
  <div xmlns="http://www.w3.org/1999/xhtml" class="card">
    <h2 class="header">Adam Langmeyer's GitHub Statistics</h2>
